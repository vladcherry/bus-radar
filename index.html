<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bus Radar — Altea · Albir · Benidorm</title>
<meta name="description" content="Live Avanzagrupo (Benidorm) buses: where each bus is right now and when it arrives at your stop.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">🚌 Bus Radar <span class="sub">Altea · Albir · Benidorm</span></div>
  <div class="topbar-actions">
    <div class="lang">
      <button id="btn-lang" class="btn-lang" title="Language"></button>
      <div id="lang-menu" class="lang-menu" hidden></div>
    </div>
    <button id="btn-locate" class="btn-locate"></button>
  </div>
</header>

<div id="map"></div>

<main class="panel">

  <!-- Stop picker -->
  <section id="view-stops">
    <div class="searchbox">
      <input id="search" type="search" autocomplete="off" inputmode="search">
    </div>
    <div id="stops-hint" class="hint"></div>
    <ul id="stops-list" class="stops-list"></ul>
  </section>

  <!-- Arrivals board -->
  <section id="view-arrivals" hidden>
    <div class="arrivals-head">
      <button id="btn-back" class="btn-back"></button>
      <div class="stop-title">
        <div id="stop-name" class="stop-name"></div>
        <div class="stop-meta">
          <span id="stop-code" class="stop-code"></span>
          <span id="stop-lines" class="stop-lines"></span>
        </div>
      </div>
      <button id="btn-fav" class="btn-fav">♡</button>
      <button id="btn-refresh" class="btn-refresh">⟳</button>
    </div>
    <div id="arrivals-status" class="hint"></div>
    <table class="arrivals" id="arrivals-table" hidden>
      <thead><tr><th id="th-line"></th><th id="th-eta"></th><th id="th-dest"></th></tr></thead>
      <tbody id="arrivals-body"></tbody>
    </table>
  </section>

  <!-- Bus route view -->
  <section id="view-bus" hidden>
    <div class="arrivals-head">
      <button id="btn-bus-back" class="btn-back"></button>
      <div class="stop-title">
        <div id="bus-title" class="stop-name"></div>
        <div class="stop-meta"><span id="bus-dest" class="stop-lines"></span></div>
      </div>
    </div>
    <div id="bus-status" class="hint"></div>
    <div id="bus-upcoming-title" class="section-title" hidden></div>
    <table class="arrivals" id="bus-table" hidden>
      <thead><tr><th id="th-bus-stop"></th><th id="th-bus-time"></th></tr></thead>
      <tbody id="bus-body"></tbody>
    </table>
  </section>

</main>

<footer class="credits" id="credits"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
